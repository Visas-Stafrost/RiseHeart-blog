<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理器 | 跃升之心的博客</title>
</head>
<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // 配置 GitHub OAuth
    if (window.CMS) {
      CMS.init({
        config: {
          backend: {
            name: 'github',
            branch: 'main',
            repo: 'Visas-Stafrost/RiseHeart-blog',
          }
        }
      });
    }
  </script>
</body>
</html>
